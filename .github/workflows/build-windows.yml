name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Fetch FFmpeg
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch_ffmpeg.ps1

      - name: Build
        shell: pwsh
        run: |
          uv sync --extra dev
          uv run pyinstaller --noconfirm --clean video_recovery.spec

      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VideoRecovery/* -DestinationPath dist/VideoRecovery-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoRecovery-windows-x64
          path: dist/VideoRecovery-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoRecovery-windows-x64.zip
          generate_release_notes: true
